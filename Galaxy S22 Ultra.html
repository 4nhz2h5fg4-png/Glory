function now(){const d=new Date();return new Date(2022,10,Math.min(d.getDate(),30),d.getHours(),d.getMinutes(),d.getSeconds())}
const mm=d=>String(d.getMinutes()).padStart(2,'0'),t24=d=>String(d.getHours()).padStart(2,'0')+':'+mm(d);
const dstr=d=>`11월 ${d.getDate()}일 ${DAY[d.getDay()]}요일`;
let locked=true;
function tick(){const d=now();$('#sl').textContent=locked?'':t24(d);[['#wt',t24(d)],['#wd',dstr(d)],['#lt',t24(d)],['#ld',dstr(d)],['#st1',t24(d)],['#st2',dstr(d)]].forEach(([s,t])=>{const e=$(s);if(e)e.textContent=t})}
setInterval(tick,1000);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}

function settings(){const L=[['#3e91ff','📶','연결','Wi-Fi · 블루투스 · 비행기 탑승 모드'],['#34c759','🔊','소리 및 진동','소리 모드 · 벨소리'],['#ff9f0a','🔔','알림','상태 표시줄 · 방해 금지 모드'],['#8e6bff','📱','디스플레이','밝은 모드 · 어두운 모드 · 화면 주사율'],['#ff6b9a','🎨','배경화면 및 스타일','배경화면 · 색상 팔레트'],['#30b0c7','🔋','배터리 및 디바이스 케어','저장공간 · 메모리 · 보안'],['#5e6bc0','🔒','보안 및 개인 정보 보호','잠금화면 · 생체 인식'],['#8e8e93','ℹ','휴대전화 정보','Galaxy S22 Ultra · One UI 4.1']];
 pg(lg('설정',SRCH)+`<div class="body"><div class="row sec" style="padding:14px"><div class="av" style="background:#3e91ff">하</div><div class="m"><b>하도영</b><small>Samsung 계정</small></div></div><div class="sec">${L.map(l=>`<div class="row"><div class="ic" style="background:${l[0]}">${l[1]}</div><div class="m"><b style="font-size:16px">${l[2]}</b><small>${l[3]}</small></div></div>`).join('')}</div></div>`)}
function weather(){const H=[['지금','☀️',6],['오후 1시','☀️',10],['오후 3시','🌤️',11],['오후 5시','🌤️',9],['오후 7시','🌙',6],['오후 9시','🌙',4]],D=[['오늘','☀️',11,1],['내일','⛅',9,0],['모레','☁️',8,2],['금','🌧️',10,5],['토','🌤️',9,1]];
 $('#pg').style.background='linear-gradient(#2a6db5,#17426f 60%,#0f2c4a)';pg(`<div style="text-align:center;padding:56px 0 10px"><div style="font-size:20px">세명시</div><div style="font-size:92px;font-weight:200;line-height:1.1">6°</div><div style="font-size:16px;opacity:.9">맑음 · 11° / 1°</div></div><div class="body"><div class="card"><div class="hr">${H.map(h=>`<div>${h[0]}<br>${h[1]}<b>${h[2]}°</b></div>`).join('')}</div></div><div class="card">${D.map(d=>`<div class="dr"><span style="width:50px">${d[0]}</span><span>${d[1]}</span><span><span style="opacity:.6">${d[3]}°</span> / ${d[2]}°</span></div>`).join('')}</div></div>`)}
function camera(){const i=t=>`<span style="font-size:19px">${t}</span>`;pg(`<div class="vf"><div style="position:absolute;top:48px;left:0;right:0;display:flex;justify-content:space-around;color:#fff">${i('⚙')}${i('⚡')}${i('◷')}<span style="font-size:14px;border:1.500px solid #fff;border-radius:5px;padding:0 5px">3:4</span>${i('✦')}</div><div class="zm"><span>.6</span><span class="on">1x</span><span>3</span><span>10</span></div></div><div class="cb"><div class="md"><span>더 보기</span><span>동영상</span><span class="on">사진</span><span>인물 사진</span><span>프로</span></div><div class="sh2"><div class="t"><img src="${IMGS[PH[0][0]]}" alt=""></div><div class="b"><i></i></div><div style="font-size:28px">⟲</div></div></div>`)}
/* 알림창 */
const NT=[['msg','메시지','전재준','보자고, 중요한 얘기니까.',1],['phone','전화','부재중 전화','연진 · 1건',0],['msg','메시지','연진','나 없을테니까 와서 먹으라고',1],['msg','메시지','예솔','아빠 어디야?',3],['cal','캘린더','임원 회의','오전 10:00 · 재평건설 본사',0]];
const ntH=(n,fn)=>`<div class="nt" onclick="${fn}(${NT.indexOf(n)})"><div class="h">${ico(n[0],16)}${n[1]}</div><b>${n[2]}</b><span>${n[3]}</span></div>`;
function ntGo(i){const n=NT[i];shadeClose();unlock(()=>{openApp(n[0]);if(n[0]=='msg')thread(n[4])})}
const QS=[['📶','Wi-Fi',1],['🔊','소리',1],['ᛒ','블루투스',1],['✈','비행기 탑승 모드',0],['⟳','자동 회전',1],['🔦','손전등',0],['📍','위치',1],['🔋','절전 모드',0]];
function shadeOpen(){if(locked)return;const s=$('#shade');s.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:42px;font-weight:300" id="st1"></div><div style="font-size:14px;opacity:.8" id="st2"></div></div><div class="qs">${QS.map(q=>`<div class="${q[2]?'on':''}" onclick="this.classList.toggle('on')"><i>${q[0]}</i>${q[1]}</div>`).join('')}</div><div class="br"><i></i></div>${NT.map(n=>ntH(n,'ntGo')).join('')}<div style="height:60px"></div>`;tick();s.classList.add('on')}
function shadeClose(){$('#shade').classList.remove('on')}
$('#st').onclick=()=>$('#shade').classList.contains('on')?shadeClose():shadeOpen();
/* 잠금화면 */
let lockEl=null,after=null;
function showLock(){locked=true;hang();shadeClose();if(lockEl)lockEl.remove();const l=document.createElement('div');l.className='lock';
 l.innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.500"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><div class="t" id="lt"></div><div class="d" id="ld"></div><div class="pill" onclick="showPin()">${ico('phone',26)}${ico('cal',26)}<span>알림 2개</span></div><div class="sc" style="left:26px" onclick="unlock(()=>openApp('phone'))"><svg width="30" height="30" viewBox="0 0 56 56" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round">${GL.phone}</svg></div><div class="sc" style="right:26px" onclick="unlock(()=>openApp('camera'))"><svg width="30" height="30" viewBox="0 0 56 56" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round">${GL.camera}</svg></div><div class="fp" onclick="unlock()"><svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><path d="M8 27v-4a16 16 0 0132 0v4" stroke-dasharray="30 4"/><path d="M13 31v-8a11 11 0 0122 0v6"/><path d="M18 34V23a6 6 0 0112 0v9"/><path d="M24 23v13"/><path d="M11 34c0 3 1 6 3 8M37 31c0 4-1 7-3 11" opacity=".8"/></svg></div><div class="hint">위로 스와이프하여 잠금 해제</div>`;
 let y0=0;l.onpointerdown=e=>y0=e.clientY;l.onpointerup=e=>{if(y0-e.clientY>70)showPin()};
 P.insertBefore(l,$('#shade'));lockEl=l;P.insertBefore(l,$('.status'));$('#nav').style.visibility='hidden';tick()}
function ntLock(i){after=()=>ntGo(i);showPin()}
function showPin(){if($('.pin'))return;let d='';const p=document.createElement('div');p.className='pin';const r=()=>{p.innerHTML=`<div style="font-size:18px">PIN을 입력하세요</div><div class="pd">${[0,1,2,3].map(k=>`<i class="${k<d.length?'f':''}"></i>`).join('')}</div><div class="keys" style="width:100%">${[1,2,3,4,5,6,7,8,9,'','0','⌫'].map(k=>`<div data-k="${k}">${k}</div>`).join('')}</div>`;p.querySelectorAll('[data-k]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const k=e.dataset.k;if(k=='⌫')d=d.slice(0,-1);else if(k)d+=k;r();if(d.length==4)setTimeout(()=>{p.remove();unlock()},150)})};r();lockEl.appendChild(p)}
function unlock(fn){const f=fn||after;after=null;if(!lockEl){if(f)f();return}locked=false;const l=lockEl;$('#nav').style.visibility='';l.style.transform='translateY(-100%)';setTimeout(()=>l.remove(),340);lockEl=null;tick();if(!$('#pg')&&!$('.home'))home();if(f)f()}
/* 전원 */
function power(){const o=document.createElement('div');o.className='scroff';o.onclick=()=>{o.remove();showLock()};P.appendChild(o)}
home();showLock();
</script></body></html>
